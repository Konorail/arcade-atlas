services:
  arcade-atlas:
    build:
      context: .
    container_name: arcade-atlas
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_PATH: /app/data/arcade-atlas.sqlite
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "const port=process.env.PORT||3000; fetch('http://127.0.0.1:'+port+'/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
